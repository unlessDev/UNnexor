# Configuración de herramientas de calidad del puente local.
# No es un paquete instalable: las dependencias viven en requirements*.txt.

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv", "build", "release"]

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: orden de imports · B: bugbear
# UP: modernización · SIM: simplificaciones · RUF100: noqa obsoletos
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF100"]
ignore = [
    "E501",   # longitud de línea: la gestiona Black (cadenas largas permitidas)
    "UP006",  # List/Dict → list/dict: cambio puramente estético en código existente
    "UP035",  # idem para imports de typing
    "UP045",  # Optional[X] → X | None: idem
    "SIM105", # contextlib.suppress: preferencia de estilo
    "SIM108", # ternarios forzados reducen legibilidad en ramas con comentarios
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017"]
# Los scripts ajustan sys.path antes de importar ``app``.
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

# Paquetes nuevos del copiloto: tipado estricto desde el primer día.
[[tool.mypy.overrides]]
module = [
    "app.audio.*",
    "app.stt.*",
    "app.copilot.*",
    "app.knowledge.*",
    "app.routing.*",
    "app.compat.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["app", "tests"]
typeCheckingMode = "basic"
